name: tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt ruff==0.17.5
      - run: ruff check .
      # пакета викладача в публічному репо нема: тести йдуть на dev-конфігу й dev-моделі,
      # кейси, яким потрібні materials/ (еталонні пакети, valid.csv), пропускаються
      - run: python -m pytest -q
