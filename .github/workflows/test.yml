name: tests

on:
  push:
    branches: [main, dev, "feat/**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # materials/ (пакет викладача) у CI нема: тести еталонних пакетів пропускаються,
      # пайплайн іде на config/team_config.dev.json і log3/devsim.py.
      - run: pytest -q
